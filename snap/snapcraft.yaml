name: autodoc-ctk
title: AutoDoc
icon: assets/brand/autodoc-icon.svg
base: core24
version: "4.0.5"
summary: "AutoDoc: preencha modelos ODT/DOCX por OCR, planilha ou digitação"
description: |
  # AutoDoc

  O AutoDoc ajuda você a preencher documentos automaticamente a partir de modelos ODT e DOCX. Você pode digitar os valores, extrair de uma imagem com OCR ou preencher um documento por linha de uma planilha. O aplicativo gera os documentos finais, prontos para salvar ou imprimir. Tudo processa no seu computador; nenhum documento é enviado para a nuvem.

  ## Para quem é
  Para quem precisa preencher contratos, termos, aditivos, declarações ou outros documentos repetitivos sem digitar tudo do zero a cada vez.

  ## Como usar, passo a passo

  1. **Prepare o modelo**  
     Em um editor de texto (Word, LibreOffice etc.), escreva os campos que devem mudar usando chaves duplas: `{{nome_do_cliente}}`, `{{valor}}`, `{{data}}`. São os placeholders.

  2. **Carregue o modelo**  
     Na aba **Modelos**, clique em **Carregar Modelo** e escolha o arquivo ODT ou DOCX. O AutoDoc lê o arquivo e lista todos os placeholders encontrados.

  3. **Preencha os campos**  
     Digite o valor de cada placeholder diretamente no aplicativo. Se você tiver uma imagem ou documento digitalizado, use a aba **Gerar** e escolha **Extrair via OCR**; o aplicativo tenta ler os valores da imagem e você revisa antes de continuar.

  4. **Mapeie os campos na imagem (opcional para OCR)**  
     Na aba **Mapear**, selecione o campo e o documento, desenhe um retângulo ao redor do valor na imagem e salve. Repita até mapear todos os placeholders. O status mostra quando tudo está pronto.

  5. **Gere o documento**  
     Na aba **Gerar**, revise os valores extraídos ou preenchidos, corrija se necessário e clique em **Gerar**. O documento preenchido é criado e pode ser salvo.

  6. **Gere em lote a partir de uma planilha**  
     Na aba **Lote**, escolha um arquivo XLSX, CSV ou TSV. O AutoDoc lê as colunas e sugere qual campo de cada coluna corresponde a cada placeholder. Ajuste o mapeamento e clique em **Gerar lote** para criar um documento por linha, com relatório de sucesso e erro.

  7. **Reutilize modelos e dados**  
     Clique em **Salvar na Biblioteca** para guardar o modelo e usá-lo depois sem carregar o arquivo novamente. Use **Fichas** para salvar conjuntos de valores (cliente, contrato) e reaplicá-los com um clique. O histórico de documentos gerados fica na aba **Histórico**.

  ## Regra dos placeholders
  - Escreva sempre entre chaves duplas: `{{campo}}`
  - Use nomes curtos, sem espaços dentro das chaves (exemplo: `{{nome_cliente}}`, `{{valor_total}}`)
  - Cada placeholder deve ter um valor preenchido antes de gerar o documento
  - O nome no documento deve ser exatamente o mesmo usado no aplicativo

  ## Saída e pré-visualização
  Defina uma pasta padrão, um padrão de nome de arquivo e, se quiser, uma subpasta por data. Antes de abrir, o AutoDoc pode gerar uma pré-visualização do documento. Cada campo extraído por OCR mostra a confiança da leitura, para você revisar os duvidosos.

  ## Extrair da imagem ou digitar manualmente
  Você tem duas formas de preencher: digitar o valor de cada campo manualmente no aplicativo ou extrair automaticamente de uma imagem/documento digitalizado com OCR. Quando usar OCR, sempre revise os textos extraídos antes de gerar, pois leituras de imagem podem conter erros.

  ## Dicas
  - Use temas claro ou escuro na parte inferior da barra lateral.
  - Para lotes, a primeira linha da planilha deve conter os nomes das colunas.
  - Valide CPF, data e e-mail quando o modelo solicitar.
  - Quanto mais nítida a imagem para OCR, melhor o resultado.
grade: stable
confinement: strict
compression: lzo

contact: https://github.com/adrianoanthonymma16-boop/autodoc/issues
issues: https://github.com/adrianoanthonymma16-boop/autodoc/issues
source-code: https://github.com/adrianoanthonymma16-boop/autodoc
license: MIT

apps:
  autodoc-ctk:
    command: autodoc/AutoDoc
    extensions:
      - gnome
    plugs:
      - home
      - removable-media
    environment:
      AUTODOC_DATA_DIR: $SNAP_USER_COMMON/autodoc
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH

parts:
  autodoc:
    plugin: nil
    source: .
    build-packages:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - python3-tk
      - tk-dev
      - tcl-dev
      - build-essential
      - patchelf
      - binutils
      - libgl1
      - libglib2.0-0
      - libsm6
      - libxext6
      - libxrender1
      - libxft2
      - libfontconfig1
      - libfreetype6
      - libx11-6
      - libxcb1
    stage-packages:
      - tesseract-ocr
      - tesseract-ocr-por
      - fonts-inter
      - libgl1
      - libglib2.0-0
      - libsm6
      - libxext6
      - libxrender1
      - libxft2
      - libfontconfig1
      - libfreetype6
      - libx11-6
      - libxcb1
      - libxau6
      - libxdmcp6
      - libice6
      - libtk8.6
      - libtcl8.6
    override-build: |
      set -eux
      python3 -m venv "$CRAFT_PART_BUILD/venv"
      . "$CRAFT_PART_BUILD/venv/bin/activate"
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt pyinstaller
      python -m PyInstaller \
        --noconfirm --clean --onedir --windowed \
        --name AutoDoc \
        --paths src \
        --add-data "assets:assets" \
        --add-data "icon.png:." \
        --hidden-import PIL._tkinter_finder \
        --collect-all customtkinter \
        --collect-all ttkbootstrap \
        --collect-all openpyxl \
        --collect-all pypdfium2 \
        --add-data "packaging/pyinstaller-docx-parts.keep:docx/parts" \
        --distpath "$CRAFT_PART_INSTALL" \
        --workpath "$CRAFT_PART_BUILD/pyi-work" \
        --specpath "$CRAFT_PART_BUILD" \
        run_ctk.py
      mv "$CRAFT_PART_INSTALL/AutoDoc" "$CRAFT_PART_INSTALL/autodoc"
      cp LICENSE.txt "$CRAFT_PART_INSTALL/autodoc/LICENSE.txt"
